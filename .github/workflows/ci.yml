name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  check:
    name: Lint and Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - name: Unit tests (no live backend, no browser)
        run: uv run pytest -q --tb=short tests/ --ignore=tests/test_e2e.py
      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
      - name: E2E tests (with backend)
        run: |
          $job = Start-Job -ScriptBlock { uv run uvicorn demo_vid_mcp.app:app --host 127.0.0.1 --port 11134 --log-level warning }
          Start-Sleep 5
          uv run pytest -q --tb=short tests/test_e2e.py tests/test_pipeline.py::test_recorder_empty_steps
          Stop-Job $job -ErrorAction SilentlyContinue
          Remove-Job $job -ErrorAction SilentlyContinue
