name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  check:
    name: Lint and Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run pyright src

      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
      - name: Unit tests (no live backend)
        run: uv run pytest -q --tb=short tests/ --ignore=tests/test_e2e.py
      - name: E2E tests (with backend)
        run: |
          $job = Start-Job -ScriptBlock { uv run uvicorn demo_vid_mcp.app:app --host 127.0.0.1 --port 11134 --log-level warning }
          Start-Sleep 5
          uv run pytest -q --tb=short tests/test_e2e.py --no-cov
          Stop-Job $job -ErrorAction SilentlyContinue
          Remove-Job $job -ErrorAction SilentlyContinue

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install webapp dependencies
        working-directory: webapp
        run: bun install --frozen-lockfile
      - name: Webapp typecheck
        working-directory: webapp
        run: bun run check
      - name: Webapp Biome check
        working-directory: webapp
        run: bun run biome:ci
      - name: Webapp build
        working-directory: webapp
        run: bun run build
      - name: Install Playwright browsers (webapp e2e)
        working-directory: webapp
        run: bunx playwright install --with-deps chromium
      - name: Webapp e2e (Playwright)
        working-directory: webapp
        run: bunx playwright test
