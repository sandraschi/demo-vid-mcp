[project]
name = "demo-vid-mcp"
version = "0.3.0"

description = "Fleet intro video pipeline — record, narrate, compose, refine."
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "starlette>=1.0.1",
    "uvicorn>=0.29.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",  # pydub needs audioop, removed in Python 3.13 — LTS backport
]

[project.scripts]
demo-vid = "demo_vid_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_vid_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"scripts/*" = ["T20"]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.0,<0.17",
    "pyright>=1.1.411",
    "pre-commit>=4.6.1",
    "pyinstaller>=6.22.2",
    "pywinauto>=0.6.9",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-q --ignore=tests/test_e2e.py --cov=src/demo_vid_mcp --cov-report=term-missing --cov-fail-under=40"
